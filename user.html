<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Construction Map Tracker</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    html, body { height: 100vh; margin: 0; padding: 0; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .leaflet-pane { z-index: 10 !important; }
    .leaflet-top, .leaflet-bottom { z-index: 20 !important; }
    
    /* แก้ไขปัญหา Leaflet บังคับสีแท็ก <a> จนบังตัวหนังสือ */
    .leaflet-container a {
      color: inherit;
      text-decoration: none;
    }
    
    .sidebar-transition {
      transition: all 0.3s ease-in-out;
    }

    /* ตกแต่ง Icon หมุดแผนที่แบบกำหนดเอง */
    .custom-marker-pin {
      display: flex;
      justify-content: center;
      align-items: center;
    }
  /* Data-loading countdown: ring tracks waiting time; the moving bar is not a percentage. */
  .load-ring{--countdown-percent:100%;width:116px;height:116px;border-radius:50%;padding:7px;
    background:conic-gradient(#f59e0b var(--countdown-percent),#e2e8f0 0);transition:background .15s}
  .load-ring-inner{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;
    justify-content:center;flex-direction:column;background:#fff}
  .load-running-bar{width:34%;height:100%;border-radius:999px;background:#f59e0b;
    animation:load-travel 1.3s ease-in-out infinite alternate}
  @keyframes load-travel{from{transform:translateX(0)}to{transform:translateX(194%)}}
  @media(prefers-reduced-motion:reduce){.load-running-bar{animation:none;width:100%;opacity:.7}}
  </style>
</head>
<body class="bg-slate-100 font-sans flex flex-col h-full w-full">

  <!-- ================= HEADER ================= -->
  <header class="bg-slate-900 text-white px-4 py-3 shadow-md flex justify-between items-center z-[100] shrink-0">
    <div class="flex items-center gap-3">
      <button onclick="toggleSidebar()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 p-2 rounded-lg transition" title="ซ่อน/แสดง เมนู">
        <i class="fa-solid fa-bars text-lg"></i>
      </button>

      <div class="bg-amber-500 text-slate-900 p-2 rounded-lg font-bold">
        <i class="fa-solid fa-house-chimney text-lg"></i>
      </div>
      <div>
        <h1 class="font-bold text-base md:text-lg leading-tight">Construction Map Tracker</h1>
        <p class="text-xs text-slate-400 hidden md:block">ระบบพิกัดหน้างานและไซต์ก่อสร้างออนไลน์</p>
      </div>
    </div>
  </header>

  <!-- ================= MAIN CONTENT ================= -->
  <div class="flex-1 flex flex-col md:flex-row relative overflow-hidden">

    <!-- SIDEBAR -->
    <div id="sidebar" class="sidebar-transition w-full md:w-[380px] bg-white border-r border-slate-200 flex flex-col z-[50] h-1/2 md:h-full shadow-lg shrink-0">
      
      <div class="p-3 border-b border-slate-200 bg-slate-900 text-white flex justify-between items-center shrink-0">
        <span class="text-xs font-bold uppercase tracking-wider text-amber-500 flex items-center gap-2">
          <i class="fa-solid fa-list-check"></i> รายการโครงการทั้งหมด
        </span>
        <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white p-1 rounded text-sm" title="ยุบเมนู">
          <i class="fa-solid fa-chevron-left hidden md:inline"></i>
          <i class="fa-solid fa-chevron-up md:hidden"></i>
        </button>
      </div>

      <!-- SEARCH & FILTER -->
      <div class="p-3 border-b border-slate-100 bg-slate-50 space-y-2.5 shrink-0">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
          <input type="text" id="searchInput" oninput="filterData()" placeholder="ค้นหาชื่อบ้าน, ที่อยู่, สถานะ..." 
                 class="w-full pl-9 pr-4 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-sm">
        </div>
        
        <div class="flex gap-1.5">
          <button onclick="filterStatus('ALL')" class="bg-slate-800 text-white text-xs px-3 py-1.5 rounded-full font-medium shadow-sm">ทั้งหมด</button>
          <button onclick="filterStatus('สร้างเสร็จแล้ว')" class="bg-white border border-slate-300 text-slate-600 hover:bg-slate-100 text-xs px-3 py-1.5 rounded-full font-medium">เสร็จแล้ว</button>
          <button onclick="filterStatus('กำลังก่อสร้าง')" class="bg-white border border-slate-300 text-slate-600 hover:bg-slate-100 text-xs px-3 py-1.5 rounded-full font-medium">กำลังสร้าง</button>
        </div>
      </div>

      <!-- LIST DATA -->
      <div id="projectList" class="flex-1 overflow-y-auto p-3 space-y-3"></div>
      
      <div class="p-2 border-t text-center text-xs text-slate-400 shrink-0 bg-white">
        พบข้อมูลทั้งหมด <span id="projectCount" class="font-bold text-slate-700">0</span> รายการ
      </div>
    </div>

    <!-- MAP CONTAINER -->
    <div class="flex-1 relative z-0 h-full bg-slate-200">
      <div id="map" class="w-full h-full"></div>
    </div>
  </div>

  <!-- ================= ปุ่มตำแหน่งของฉัน (มุมขวาล่างของจอ) ================= -->
  <button onclick="locateUser()" title="ค้นหาตำแหน่งของฉัน" 
          class="fixed bottom-6 right-6 z-[90] bg-white hover:bg-slate-50 text-slate-800 font-bold px-4 py-2.5 rounded-full shadow-2xl border border-slate-200 flex items-center gap-2 text-xs md:text-sm transition-all active:scale-95 group">
    <i class="fa-solid fa-crosshairs text-blue-600 text-base group-hover:rotate-45 transition-transform"></i>
    <span>ตำแหน่งของฉัน</span>
  </button>

<!-- Data load countdown / connection status -->
<div id="loadingOverlay" class="fixed inset-0 z-[20000] hidden items-center justify-center bg-slate-950/70 backdrop-blur-sm p-4" role="status" aria-live="polite" aria-label="สถานะการโหลดข้อมูล">
  <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl">
    <div class="bg-slate-900 text-white px-5 py-4 flex items-center gap-3">
      <div class="bg-amber-500 text-slate-900 h-10 w-10 rounded-xl flex items-center justify-center"><i class="fa-solid fa-map-location-dot"></i></div>
      <div><h2 class="font-bold text-base">Construction Map Tracker</h2><p class="text-xs text-slate-300">เชื่อมต่อข้อมูลหน้างาน</p></div>
    </div>
    <div class="px-6 pt-7 pb-6 text-center">
      <div id="loadingRing" class="load-ring mx-auto mb-5" aria-hidden="true">
        <div class="load-ring-inner"><strong id="loadingSeconds" class="text-4xl leading-none text-slate-800">15</strong><span class="text-[11px] text-slate-500 mt-1">วินาที</span></div>
      </div>
      <h3 id="loadingTitle" class="text-lg font-bold text-slate-800">กำลังโหลดข้อมูลโครงการ</h3>
      <p id="loadingDescription" class="text-sm text-slate-500 mt-2 min-h-[40px]">กำลังดึงข้อมูลล่าสุดจากเซิร์ฟเวอร์...</p>
      <div id="loadingBarTrack" class="h-1.5 bg-slate-100 rounded-full overflow-hidden mt-4"><div id="loadingBar" class="load-running-bar"></div></div>
      <p id="loadingHint" class="text-xs text-slate-400 mt-3">หน้าต่างจะปิดอัตโนมัติเมื่อโหลดเสร็จ</p>
      <button type="button" id="retryLoadingBtn" onclick="fetchProjects()" class="hidden mt-5 w-full rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3"><i class="fa-solid fa-rotate-right mr-1"></i> ลองโหลดข้อมูลอีกครั้ง</button>
    </div>
  </div>
</div>

  <!-- ================= SCRIPT ================= -->
  <script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby6BVv16v4jQVZc5VIOIbvuz6yWkef4Wzc-Oe5VQuFQC0agZgTGGbjxNMLSKPcSrDO74Q/exec";

  let projects = [];
  let map, markersGroup;
  let isSidebarOpen = true;

  const LOAD_COUNTDOWN_SECONDS = 15;
  const LOAD_TIMEOUT_MS = 30000;
  let loadingInterval = null;
  let activeFetchController = null;
  let fetchSequence = 0;
  const $ = id => document.getElementById(id);

  document.addEventListener("DOMContentLoaded", () => {
    setTimeout(() => {
      initMap();
      fetchProjects();
    }, 300);
  });

  function initMap() {
    map = L.map('map').setView([14.9733, 102.0831], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    markersGroup = L.layerGroup().addTo(map);
  }

  // สร้าง Icon หมุดตามสถานะ (สร้างเสร็จแล้ว = สีเขียว, กำลังก่อสร้าง = สีส้ม)
  function createCustomIcon(status) {
    const isDone = status === 'สร้างเสร็จแล้ว';
    const bgColor = isDone ? '#10b981' : '#f97316';
    const iconClass = isDone ? 'fa-house-check' : 'fa-helmet-safety';

    const htmlContent = `
      <div style="position: relative; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;">
        <div style="
          background-color: ${bgColor};
          width: 34px;
          height: 34px;
          border-radius: 50% 50% 50% 0;
          transform: rotate(-45deg);
          border: 2px solid #ffffff;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
          position: absolute;
        "></div>
        <i class="fa-solid ${iconClass}" style="
          color: white;
          font-size: 13px;
          position: relative;
          z-index: 10;
          transform: rotate(0deg);
        "></i>
      </div>
    `;

    return L.divIcon({
      className: 'custom-marker-pin',
      html: htmlContent,
      iconSize: [34, 34],
      iconAnchor: [17, 34],
      popupAnchor: [0, -34]
    });
  }

  // ดึงข้อมูลจาก Google Sheets พร้อมหน้าต่างนับถอยหลังและปุ่มลองใหม่
  function setLoadingSeconds(remaining) {
    $('loadingSeconds').textContent = remaining;
    $('loadingRing').style.setProperty('--countdown-percent', (remaining / LOAD_COUNTDOWN_SECONDS * 100) + '%');
  }

  function beginDataLoading() {
    clearInterval(loadingInterval);
    const started = Date.now();
    setLoadingSeconds(LOAD_COUNTDOWN_SECONDS);
    $('loadingTitle').textContent = 'กำลังโหลดข้อมูลโครงการ';
    $('loadingDescription').textContent = 'กำลังดึงข้อมูลล่าสุดจากเซิร์ฟเวอร์...';
    $('loadingHint').textContent = 'หน้าต่างจะปิดอัตโนมัติเมื่อโหลดเสร็จ';
    $('retryLoadingBtn').classList.add('hidden');
    $('loadingBarTrack').classList.remove('hidden');
    $('loadingOverlay').classList.replace('hidden', 'flex');

    loadingInterval = setInterval(() => {
      const elapsed = Math.floor((Date.now() - started) / 1000);
      const remaining = Math.max(0, LOAD_COUNTDOWN_SECONDS - elapsed);
      setLoadingSeconds(remaining);
      if (remaining === 0) {
        $('loadingDescription').textContent = 'เซิร์ฟเวอร์ตอบกลับช้ากว่าปกติ ระบบยังรอข้อมูลอยู่...';
        $('loadingHint').textContent = 'ตัวเลขเป็นเวลารอเบื้องต้น ไม่ใช่ความคืบหน้าการดาวน์โหลด';
        clearInterval(loadingInterval);
        loadingInterval = null;
      }
    }, 250);
  }

  function endDataLoading() {
    clearInterval(loadingInterval);
    loadingInterval = null;
    $('loadingOverlay').classList.replace('flex', 'hidden');
  }

  function failDataLoading(message) {
    clearInterval(loadingInterval);
    loadingInterval = null;
    $('loadingTitle').textContent = 'โหลดข้อมูลไม่สำเร็จ';
    $('loadingDescription').textContent = message;
    $('loadingHint').textContent = 'ตรวจสอบอินเทอร์เน็ตหรือการเข้าถึง Google Apps Script';
    $('loadingBarTrack').classList.add('hidden');
    $('retryLoadingBtn').classList.remove('hidden');
    $('loadingRing').style.setProperty('--countdown-percent', '0%');
    $('loadingSeconds').textContent = '!';
  }

  async function fetchProjects() {
    // A new request supersedes an earlier one (for example after tapping Retry).
    if (activeFetchController) activeFetchController.abort();
    const controller = new AbortController();
    activeFetchController = controller;
    const seq = ++fetchSequence;
    beginDataLoading();
    let didTimeout = false;
    const timeoutId = setTimeout(() => {
      didTimeout = true;
      controller.abort();
    }, LOAD_TIMEOUT_MS);

    try {
      const response = await fetch(WEB_APP_URL, { signal: controller.signal, cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const json = await response.json();
      if (json.status !== 'success' || !Array.isArray(json.data)) {
        throw new Error(json.message || 'รูปแบบข้อมูลจากเซิร์ฟเวอร์ไม่ถูกต้อง');
      }
      if (seq !== fetchSequence) return false;
      projects = json.data;
      renderUI(projects);
      endDataLoading();
      return true;
    } catch (err) {
      if (seq !== fetchSequence) return false;
      console.error('โหลดข้อมูลโครงการไม่สำเร็จ:', err);
      failDataLoading(didTimeout
        ? 'รอการตอบกลับนานเกิน 30 วินาที กรุณาลองใหม่'
        : 'ไม่สามารถเชื่อมต่อหรืออ่านข้อมูลจากเซิร์ฟเวอร์ได้');
      return false;
    } finally {
      clearTimeout(timeoutId);
      if (seq === fetchSequence) activeFetchController = null;
    }
  }


  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    if (isSidebarOpen) {
      sidebar.classList.add('hidden');
    } else {
      sidebar.classList.remove('hidden');
    }
    isSidebarOpen = !isSidebarOpen;
    
    setTimeout(() => {
      if(map) map.invalidateSize();
    }, 300);
  }

  function renderUI(data) {
    const listContainer = document.getElementById('projectList');
    listContainer.innerHTML = '';
    if (markersGroup) markersGroup.clearLayers();

    document.getElementById('projectCount').innerText = data.length;

    data.forEach(p => {
      const isDone = p.status === 'สร้างเสร็จแล้ว';
      const badgeColor = isDone ? 'bg-emerald-100 text-emerald-700 border-emerald-300' : 'bg-amber-100 text-amber-700 border-amber-300';
      const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;

      if (map && markersGroup) {
        const customIcon = createCustomIcon(p.status);

        // กำหนด style="color: #ffffff !important;" ชัดเจนเพื่อไม่ให้ Leaflet CSS บังคับสีเดิม
        const marker = L.marker([p.lat, p.lng], { icon: customIcon }).bindPopup(`
          <div class="font-sans text-xs p-1" style="min-width: 200px;">
            <img src="${p.image}" class="w-full h-24 object-cover rounded mb-2" onerror="this.src='https://images.unsplash.com/photo-1503387762-592deb58ef4e?w=500&q=80'">
            <strong class="text-slate-800 text-sm block leading-snug">${p.name}</strong>
            <p class="text-slate-500 my-1"><i class="fa-solid fa-location-dot"></i> ${p.address}</p>
            <div class="mt-2 flex justify-between items-center border-t pt-2">
              <span class="inline-block px-1.5 py-0.5 rounded text-[10px] font-bold ${badgeColor}">${p.status}</span>
              <a href="${gmapsUrl}" target="_blank" class="bg-blue-600 hover:bg-blue-700 !text-white px-2.5 py-1 rounded text-[10px] font-bold flex items-center gap-1 shadow" style="color: #ffffff !important;">
                <i class="fa-solid fa-diamond-turn-right" style="color: #ffffff !important;"></i>
                <span style="color: #ffffff !important;">นำทาง</span>
              </a>
            </div>
          </div>
        `);
        markersGroup.addLayer(marker);
        p.markerRef = marker;
      }

      const card = document.createElement('div');
      card.className = "bg-white p-3 rounded-xl border border-slate-200 shadow-sm hover:shadow-md hover:border-amber-400 transition cursor-pointer flex flex-col gap-2 group";
      card.innerHTML = `
        <div class="flex gap-3">
          <img src="${p.image}" class="w-20 h-20 sm:w-24 sm:h-24 rounded-lg object-cover bg-slate-100 shrink-0" onerror="this.src='https://images.unsplash.com/photo-1503387762-592deb58ef4e?w=500&q=80'">
          <div class="flex-1 flex flex-col justify-between overflow-hidden">
            <div>
              <span class="text-[10px] px-2 py-0.5 rounded-full border font-semibold ${badgeColor}">${p.status}</span>
              <h4 class="font-bold text-slate-800 text-sm truncate mt-1 group-hover:text-blue-600 transition-colors">${p.name}</h4>
              <p class="text-xs text-slate-500 truncate"><i class="fa-solid fa-location-dot text-slate-400"></i> ${p.address}</p>
            </div>
            <p class="text-[11px] text-slate-600 line-clamp-1 mt-1">${p.details}</p>
          </div>
        </div>
        <div class="pt-2 border-t border-slate-100 flex items-center">
          <a href="${gmapsUrl}" target="_blank" onclick="event.stopPropagation();" 
             class="w-full bg-blue-600 hover:bg-blue-700 !text-white py-1.5 px-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1 transition shadow" style="color: #ffffff !important;">
            <i class="fa-solid fa-diamond-turn-right" style="color: #ffffff !important;"></i>
            <span style="color: #ffffff !important;">นำทางไปยังไซต์งาน</span>
          </a>
        </div>
      `;

      card.querySelector('.flex').onclick = () => {
        if (map && p.markerRef) {
          map.flyTo([p.lat, p.lng], 15);
          p.markerRef.openPopup();
        }
      };
      listContainer.appendChild(card);
    });
  }

  function filterData() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    renderUI(projects.filter(p => p.name.toLowerCase().includes(query) || p.address.toLowerCase().includes(query) || p.status.toLowerCase().includes(query)));
  }

  function filterStatus(status) {
    renderUI(status === 'ALL' ? projects : projects.filter(p => p.status === status));
  }

  function locateUser() {
    if (map) {
      map.locate({setView: true, maxZoom: 15});
      map.once('locationfound', (e) => {
        L.circle(e.latlng, e.accuracy, { color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.2 }).addTo(map);
        L.marker(e.latlng).addTo(map).bindPopup("คุณอยู่ที่นี่").openPopup();
      });
    }
  }
</script>
</body>
</html>
