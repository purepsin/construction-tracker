<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Construction Map Tracker</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    html, body { height: 100vh; margin: 0; padding: 0; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .leaflet-pane { z-index: 10 !important; }
    .leaflet-top, .leaflet-bottom { z-index: 20 !important; }
    
    .sidebar-transition {
      transition: all 0.3s ease-in-out;
    }

    /* ตกแต่ง Icon หมุดแผนที่แบบกำหนดเอง */
    .custom-marker-pin {
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body class="bg-slate-100 font-sans flex flex-col h-full w-full">

  <!-- ================= HEADER ================= -->
  <header class="bg-slate-900 text-white px-4 py-3 shadow-md flex justify-between items-center z-[100] shrink-0">
    <div class="flex items-center gap-3">
      <button onclick="toggleSidebar()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 p-2 rounded-lg transition" title="ซ่อน/แสดง เมนู">
        <i class="fa-solid fa-bars text-lg"></i>
      </button>

      <div class="bg-amber-500 text-slate-900 p-2 rounded-lg font-bold hidden sm:block">
        <i class="fa-solid fa-house-chimney text-lg"></i>
      </div>
      <div>
        <h1 class="font-bold text-base md:text-lg leading-tight">Construction Map Tracker</h1>
        <p class="text-xs text-slate-400 hidden md:block">ระบบพิกัดหน้างานและไซต์ก่อสร้างออนไลน์</p>
      </div>
    </div>

    <button onclick="openAddModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-2 transition shadow">
      <i class="fa-solid fa-plus-circle"></i>
      <span class="hidden sm:inline">เพิ่มพิกัดหน้างาน (Admin)</span>
      <span class="sm:hidden">เพิ่ม</span>
    </button>
  </header>

  <!-- ================= MAIN CONTENT ================= -->
  <div class="flex-1 flex flex-col md:flex-row relative overflow-hidden">

    <!-- SIDEBAR -->
    <div id="sidebar" class="sidebar-transition w-full md:w-[380px] bg-white border-r border-slate-200 flex flex-col z-[50] h-1/2 md:h-full shadow-lg shrink-0">
      
      <div class="p-3 border-b border-slate-200 bg-slate-900 text-white flex justify-between items-center shrink-0">
        <span class="text-xs font-bold uppercase tracking-wider text-amber-500 flex items-center gap-2">
          <i class="fa-solid fa-list-check"></i> รายการโครงการทั้งหมด
        </span>
        <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white p-1 rounded text-sm" title="ยุบเมนู">
          <i class="fa-solid fa-chevron-left hidden md:inline"></i>
          <i class="fa-solid fa-chevron-up md:hidden"></i>
        </button>
      </div>

      <div class="p-3 border-b border-slate-100 bg-slate-50 space-y-2.5 shrink-0">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
          <input type="text" id="searchInput" oninput="filterData()" placeholder="ค้นหาชื่อบ้าน, ที่อยู่, สถานะ..." 
                 class="w-full pl-9 pr-4 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-sm">
        </div>
        
        <div class="flex gap-1.5">
          <button onclick="filterStatus('ALL')" class="bg-slate-800 text-white text-xs px-3 py-1.5 rounded-full font-medium shadow-sm">ทั้งหมด</button>
          <button onclick="filterStatus('สร้างเสร็จแล้ว')" class="bg-white border border-slate-300 text-slate-600 hover:bg-slate-100 text-xs px-3 py-1.5 rounded-full font-medium">เสร็จแล้ว</button>
          <button onclick="filterStatus('กำลังก่อสร้าง')" class="bg-white border border-slate-300 text-slate-600 hover:bg-slate-100 text-xs px-3 py-1.5 rounded-full font-medium">กำลังสร้าง</button>
        </div>
      </div>

      <!-- LIST DATA -->
      <div id="projectList" class="flex-1 overflow-y-auto p-3 space-y-3"></div>
      
      <div class="p-2 border-t text-center text-xs text-slate-400 shrink-0 bg-white">
        พบข้อมูลทั้งหมด <span id="projectCount" class="font-bold text-slate-700">0</span> รายการ
      </div>
    </div>

    <!-- MAP CONTAINER -->
    <div class="flex-1 relative z-0 h-full bg-slate-200">
      <div id="map" class="w-full h-full"></div>
      
      <button onclick="locateUser()" title="ค้นหาตำแหน่งของฉัน" 
              class="absolute bottom-6 right-6 z-[30] bg-white hover:bg-slate-50 text-slate-700 p-3 rounded-full shadow-lg border border-slate-200 focus:outline-none text-lg flex items-center justify-center w-12 h-12">
        <i class="fa-solid fa-crosshairs text-blue-600"></i>
      </button>
    </div>
  </div>

  <!-- ================= MODAL ADD/EDIT SITE ================= -->
  <div id="adminModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[9999] flex justify-center items-center hidden p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
      
      <div class="bg-slate-900 text-white px-5 py-4 flex justify-between items-center shrink-0">
        <h3 id="modalTitle" class="font-bold text-base flex items-center gap-2">
          <i class="fa-solid fa-location-dot text-amber-500"></i> บันทึกข้อมูลพิกัดก่อสร้างใหม่
        </h3>
        <button type="button" onclick="closeAdminModal()" class="text-slate-400 hover:text-white text-lg">×</button>
      </div>

      <form id="addProjectForm" onsubmit="handleFormSubmit(event)" class="p-5 overflow-y-auto space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">ชื่อโครงการ / บ้านลูกค้า *</label>
          <input type="text" id="projectName" required placeholder="เช่น บ้านคุณสมชาย - แปลง A" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">สถานะโครงการ</label>
          <select id="projectStatus" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
            <option value="กำลังก่อสร้าง">กำลังก่อสร้าง</option>
            <option value="สร้างเสร็จแล้ว">สร้างเสร็จแล้ว</option>
          </select>
        </div>

        <!-- กล่องเลือกไฟล์รูปภาพ + ปุ่มถ่ายรูป -->
        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">รูปภาพหน้างาน / บ้าน</label>
          
          <div class="grid grid-cols-2 gap-2 mb-2">
            <!-- ปุ่มถ่ายภาพด้วยกล้องมือถือ -->
            <label class="bg-emerald-600 hover:bg-emerald-700 text-white py-2 px-3 rounded-lg text-xs font-bold text-center cursor-pointer flex items-center justify-center gap-2 shadow transition">
              <i class="fa-solid fa-camera text-sm"></i>
              <span>ถ่ายภาพหน้างาน</span>
              <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="previewImage(event)" class="hidden">
            </label>

            <!-- ปุ่มเลือกไฟล์จากอัลบั้ม -->
            <label class="bg-slate-200 hover:bg-slate-300 text-slate-700 py-2 px-3 rounded-lg text-xs font-bold text-center cursor-pointer flex items-center justify-center gap-2 transition">
              <i class="fa-solid fa-image text-sm"></i>
              <span>เลือกจากเครื่อง</span>
              <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)" class="hidden">
            </label>
          </div>

          <div id="previewContainer" class="mt-2 hidden relative rounded-lg overflow-hidden border border-slate-300 bg-white">
            <img id="imagePreview" src="" class="w-full h-40 object-cover">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">ที่อยู่อย่างย่อ</label>
          <input type="text" id="projectAddress" placeholder="เช่น อ.เมือง จ.นครราชสีมา" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
        </div>

        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-2">
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold text-slate-700 uppercase">พิกัดสถานที่ (Lat, Lng) *</span>
            <button type="button" onclick="getCurrentGPS()" class="text-xs text-blue-600 hover:text-blue-800 font-semibold flex items-center gap-1">
              <i class="fa-solid fa-location-arrow"></i> ดึงพิกัด (GPS)
            </button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input type="number" step="any" id="projectLat" required placeholder="Latitude" class="w-full border border-slate-300 rounded p-2 text-sm bg-white">
            <input type="number" step="any" id="projectLng" required placeholder="Longitude" class="w-full border border-slate-300 rounded p-2 text-sm bg-white">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">รายละเอียดงาน</label>
          <textarea id="projectDetails" rows="2" placeholder="ระบุรายละเอียดเพิ่มเติม..." class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none"></textarea>
        </div>

        <div class="pt-2 flex justify-end gap-2 border-t shrink-0">
          <button type="button" onclick="closeAdminModal()" class="px-4 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100 font-medium">ยกเลิก</button>
          <button type="submit" id="submitBtn" class="px-4 py-2 rounded-lg text-sm bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold shadow">บันทึกข้อมูล</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ================= SCRIPT ================= -->
  <script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby6BVv16v4jQVZc5VIOIbvuz6yWkef4Wzc-Oe5VQuFQC0agZgTGGbjxNMLSKPcSrDO74Q/exec";
  
  // ImgBB API Key
  const IMGBB_API_KEY = "97f1a9893964ef32a3beebcd4b20e483"; 

  let projects = [];
  let map, markersGroup;
  let isSidebarOpen = true;
  
  let selectedFile = null;
  let editingId = null;
  let existingImageUrl = "";

  document.addEventListener("DOMContentLoaded", () => {
    setTimeout(() => {
      initMap();
      fetchProjects();
    }, 300);
  });

  // ฟังก์ชันย่อขนาดและบีบอัดรูปภาพก่อนอัปโหลด
  function compressImage(file, maxWidth = 1200, maxHeight = 1200, quality = 0.7) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        
        img.onload = () => {
          let width = img.width;
          let height = img.height;

          // คำนวณอัตราส่วนเพื่อย่อขนาด
          if (width > height) {
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
          } else {
            if (height > maxHeight) {
              width = Math.round((width * maxHeight) / height);
              height = maxHeight;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          canvas.toBlob((blob) => {
            if (blob) {
              const compressedFile = new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".jpg", {
                type: 'image/jpeg',
                lastModified: Date.now()
              });
              resolve(compressedFile);
            } else {
              reject(new Error("ไม่สามารถบีบอัดรูปภาพได้"));
            }
          }, 'image/jpeg', quality);
        };
        
        img.onerror = (err) => reject(err);
      };
      
      reader.onerror = (err) => reject(err);
    });
  }

  function initMap() {
    map = L.map('map').setView([14.9733, 102.0831], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    markersGroup = L.layerGroup().addTo(map);
  }

  // สร้าง Icon หมุดตามสถานะ (สร้างเสร็จแล้ว = สีเขียว, กำลังก่อสร้าง = สีส้ม)
  function createCustomIcon(status) {
    const isDone = status === 'สร้างเสร็จแล้ว';
    const bgColor = isDone ? '#10b981' : '#f97316'; // เขียว (Emerald) หรือ ส้ม (Orange)
    const iconClass = isDone ? 'fa-house-check' : 'fa-helmet-safety'; // ไอคอนในหมุด

    const htmlContent = `
      <div style="position: relative; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;">
        <div style="
          background-color: ${bgColor};
          width: 34px;
          height: 34px;
          border-radius: 50% 50% 50% 0;
          transform: rotate(-45deg);
          border: 2px solid #ffffff;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
          position: absolute;
        "></div>
        <i class="fa-solid ${iconClass}" style="
          color: white;
          font-size: 13px;
          position: relative;
          z-index: 10;
          transform: rotate(0deg);
        "></i>
      </div>
    `;

    return L.divIcon({
      className: 'custom-marker-pin',
      html: htmlContent,
      iconSize: [34, 34],
      iconAnchor: [17, 34], // ให้ปลายแหลมชี้ที่พิกัดพอดี
      popupAnchor: [0, -34]
    });
  }

  // ดึงข้อมูลจาก Google Sheets
  async function fetchProjects() {
    try {
      const res = await fetch(WEB_APP_URL);
      const json = await res.json();
      if (json.status === 'success') {
        projects = json.data;
        renderUI(projects);
      }
    } catch (err) {
      console.error("Error loading data:", err);
    }
  }

  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    if (isSidebarOpen) {
      sidebar.classList.add('hidden');
    } else {
      sidebar.classList.remove('hidden');
    }
    isSidebarOpen = !isSidebarOpen;
    
    setTimeout(() => {
      if(map) map.invalidateSize();
    }, 300);
  }

  function renderUI(data) {
    const listContainer = document.getElementById('projectList');
    listContainer.innerHTML = '';
    if (markersGroup) markersGroup.clearLayers();

    document.getElementById('projectCount').innerText = data.length;

    data.forEach(p => {
      const isDone = p.status === 'สร้างเสร็จแล้ว';
      const badgeColor = isDone ? 'bg-emerald-100 text-emerald-700 border-emerald-300' : 'bg-amber-100 text-amber-700 border-amber-300';
      const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;

      if (map && markersGroup) {
        // ใช้ Icon หมุดตามสถานะ
        const customIcon = createCustomIcon(p.status);

        const marker = L.marker([p.lat, p.lng], { icon: customIcon }).bindPopup(`
          <div class="font-sans text-xs p-1" style="min-width: 200px;">
            <img src="${p.image}" class="w-full h-24 object-cover rounded mb-2" onerror="this.src='https://images.unsplash.com/photo-1503387762-592deb58ef4e?w=500&q=80'">
            <strong class="text-slate-800 text-sm block leading-snug">${p.name}</strong>
            <p class="text-slate-500 my-1"><i class="fa-solid fa-location-dot"></i> ${p.address}</p>
            <div class="mt-2 flex justify-between items-center gap-1 border-t pt-2">
              <span class="inline-block px-1.5 py-0.5 rounded text-[10px] font-bold ${badgeColor}">${p.status}</span>
              <div class="flex items-center gap-1">
                <button onclick="openEditModal('${p.id}')" class="bg-amber-500 hover:bg-amber-600 text-slate-900 px-2 py-1 rounded text-[10px] font-bold flex items-center gap-1">
                  <i class="fa-solid fa-pen"></i> แก้ไข
                </button>
                <button onclick="deleteProject('${p.id}')" class="bg-rose-600 hover:bg-rose-700 text-white px-2 py-1 rounded text-[10px] font-bold flex items-center gap-1">
                  <i class="fa-solid fa-trash"></i> ลบ
                </button>
              </div>
            </div>
          </div>
        `);
        markersGroup.addLayer(marker);
        p.markerRef = marker;
      }

      const card = document.createElement('div');
      card.className = "bg-white p-3 rounded-xl border border-slate-200 shadow-sm hover:shadow-md hover:border-amber-400 transition cursor-pointer flex flex-col gap-2 group";
      card.innerHTML = `
        <div class="flex gap-3">
          <img src="${p.image}" class="w-20 h-20 sm:w-24 sm:h-24 rounded-lg object-cover bg-slate-100 shrink-0" onerror="this.src='https://images.unsplash.com/photo-1503387762-592deb58ef4e?w=500&q=80'">
          <div class="flex-1 flex flex-col justify-between overflow-hidden">
            <div>
              <span class="text-[10px] px-2 py-0.5 rounded-full border font-semibold ${badgeColor}">${p.status}</span>
              <h4 class="font-bold text-slate-800 text-sm truncate mt-1 group-hover:text-blue-600 transition-colors">${p.name}</h4>
              <p class="text-xs text-slate-500 truncate"><i class="fa-solid fa-location-dot text-slate-400"></i> ${p.address}</p>
            </div>
            <p class="text-[11px] text-slate-600 line-clamp-1 mt-1">${p.details}</p>
          </div>
        </div>
        <div class="pt-2 border-t border-slate-100 flex items-center gap-1.5">
          <a href="${gmapsUrl}" target="_blank" onclick="event.stopPropagation();" 
             class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-1.5 px-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1 transition shadow">
            <i class="fa-solid fa-diamond-turn-right text-white"></i>
            <span>นำทาง</span>
          </a>
          <button onclick="event.stopPropagation(); openEditModal('${p.id}');" class="bg-amber-100 hover:bg-amber-200 text-amber-800 p-1.5 rounded-lg text-xs font-bold transition" title="แก้ไข">
            <i class="fa-solid fa-pen-to-square"></i>
          </button>
          <button onclick="event.stopPropagation(); deleteProject('${p.id}');" class="bg-rose-100 hover:bg-rose-200 text-rose-700 p-1.5 rounded-lg text-xs font-bold transition" title="ลบ">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>
      `;

      card.querySelector('.flex').onclick = () => {
        if (map && p.markerRef) {
          map.flyTo([p.lat, p.lng], 15);
          p.markerRef.openPopup();
        }
      };
      listContainer.appendChild(card);
    });
  }

  function previewImage(event) {
    const file = event.target.files[0];
    if (file) {
      selectedFile = file;
      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById('imagePreview').src = e.target.result;
        document.getElementById('previewContainer').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }
  }

  // อัปโหลดภาพเข้า ImgBB API
  async function uploadToImgBB(file) {
    if (!IMGBB_API_KEY || IMGBB_API_KEY.includes("ใส่_API_KEY")) {
      throw new Error("กรุณาระบุ ImgBB API Key ก่อนใช้งาน");
    }
    const formData = new FormData();
    formData.append("image", file);

    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
      method: "POST",
      body: formData
    });
    const json = await res.json();
    if (json.success) {
      return json.data.url;
    } else {
      throw new Error(json.error?.message || "ไม่สามารถอัปโหลดรูปภาพไปยัง ImgBB ได้");
    }
  }

  function openAddModal() {
    editingId = null;
    selectedFile = null;
    existingImageUrl = "";
    document.getElementById('addProjectForm').reset();
    document.getElementById('previewContainer').classList.add('hidden');
    document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-location-dot text-amber-500"></i> บันทึกข้อมูลพิกัดก่อสร้างใหม่`;
    document.getElementById('adminModal').classList.remove('hidden');
  }

  function openEditModal(id) {
    const item = projects.find(p => String(p.id) === String(id));
    if (!item) return;

    editingId = id;
    selectedFile = null;
    existingImageUrl = item.image;

    document.getElementById('projectName').value = item.name;
    document.getElementById('projectStatus').value = item.status;
    document.getElementById('projectAddress').value = item.address;
    document.getElementById('projectLat').value = item.lat;
    document.getElementById('projectLng').value = item.lng;
    document.getElementById('projectDetails').value = item.details;

    if (item.image) {
      document.getElementById('imagePreview').src = item.image;
      document.getElementById('previewContainer').classList.remove('hidden');
    } else {
      document.getElementById('previewContainer').classList.add('hidden');
    }

    document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-pen-to-square text-amber-500"></i> แก้ไขข้อมูลพิกัดก่อสร้าง`;
    document.getElementById('adminModal').classList.remove('hidden');
  }

  function closeAdminModal() {
    document.getElementById('adminModal').classList.add('hidden');
  }

  async function deleteProject(id) {
    const item = projects.find(p => String(p.id) === String(id));
    const name = item ? item.name : "รายการนี้";
    
    if (!confirm(`คุณต้องการลบ "${name}" ใช่หรือไม่?`)) return;

    try {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({ action: "delete", id: id })
      });
      const result = await res.json();
      if (result.status === 'success') {
        alert("ลบข้อมูลเรียบร้อยแล้ว");
        await fetchProjects();
      } else {
        alert("เกิดข้อผิดพลาดในการลบ: " + result.message);
      }
    } catch (err) {
      alert("ไม่สามารถลบข้อมูลได้ กรุณาตรวจสอบการเชื่อมต่อ");
    }
  }

  function filterData() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    renderUI(projects.filter(p => p.name.toLowerCase().includes(query) || p.address.toLowerCase().includes(query) || p.status.toLowerCase().includes(query)));
  }

  function filterStatus(status) {
    renderUI(status === 'ALL' ? projects : projects.filter(p => p.status === status));
  }

  function getCurrentGPS() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          document.getElementById('projectLat').value = pos.coords.latitude.toFixed(6);
          document.getElementById('projectLng').value = pos.coords.longitude.toFixed(6);
        },
        err => alert("ไม่สามารถดึงพิกัด GPS ได้ กรุณาเปิด Location Service")
      );
    } else {
      alert("เบราว์เซอร์นี้ไม่รองรับการดึงพิกัด GPS");
    }
  }

  function locateUser() {
    if (map) {
      map.locate({setView: true, maxZoom: 15});
      map.once('locationfound', (e) => {
        L.circle(e.latlng, e.accuracy, { color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.2 }).addTo(map);
        L.marker(e.latlng).addTo(map).bindPopup("คุณอยู่ที่นี่").openPopup();
      });
    }
  }

  // บันทึก/แก้ไข ข้อมูล
  async function handleFormSubmit(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const originalText = submitBtn.innerText;
    submitBtn.disabled = true;

    const latVal = parseFloat(document.getElementById('projectLat').value);
    const lngVal = parseFloat(document.getElementById('projectLng').value);

    if (isNaN(latVal) || isNaN(lngVal)) {
      alert("กรุณาระบุพิกัด Latitude และ Longitude เป็นตัวเลขที่ถูกต้อง");
      submitBtn.disabled = false;
      return;
    }

    try {
      let imageUrl = existingImageUrl || "https://images.unsplash.com/photo-1503387762-592deb58ef4e?w=500&q=80";

      // หากมีการเลือกไฟล์รูปใหม่ ย่อขนาดไฟล์ก่อนอัปโหลดเข้า ImgBB
      if (selectedFile) {
        submitBtn.innerText = "กำลังย่อขนาดรูปภาพ...";
        const compressedFile = await compressImage(selectedFile, 1200, 1200, 0.7);

        submitBtn.innerText = "กำลังอัปโหลดรูปภาพไปยัง ImgBB...";
        imageUrl = await uploadToImgBB(compressedFile);
      }

      submitBtn.innerText = "กำลังบันทึกข้อมูล...";

      const payload = {
        action: editingId ? "update" : "create",
        id: editingId || ("P" + Date.now()),
        name: document.getElementById('projectName').value,
        status: document.getElementById('projectStatus').value,
        address: document.getElementById('projectAddress').value || "ไม่ระบุที่อยู่",
        lat: latVal,
        lng: lngVal,
        image: imageUrl,
        details: document.getElementById('projectDetails').value || "-"
      };

      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      
      const result = await res.json();
      if (result.status === 'success') {
        alert(editingId ? "แก้ไขข้อมูลเรียบร้อยแล้ว!" : "บันทึกข้อมูลเรียบร้อยแล้ว!");
        closeAdminModal();
        await fetchProjects();
        if (map) map.flyTo([payload.lat, payload.lng], 15);
      } else {
        alert("เกิดข้อผิดพลาด: " + result.message);
      }
    } catch (err) {
      alert("เกิดข้อผิดพลาด: " + err.message);
      console.error(err);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = originalText;
    }
  }
</script>
</body>
</html>
