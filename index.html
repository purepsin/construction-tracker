<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Construction Map Tracker (GitHub Pages)</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    html, body { height: 100vh; margin: 0; padding: 0; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .leaflet-pane { z-index: 10 !important; }
    .leaflet-top, .leaflet-bottom { z-index: 20 !important; }
  </style>
</head>
<body class="bg-slate-100 font-sans flex flex-col h-full w-full">

  <header class="bg-slate-900 text-white px-4 py-3 shadow-md flex justify-between items-center z-[100] shrink-0">
    <div class="flex items-center gap-3">
      <div class="bg-amber-500 text-slate-900 p-2 rounded-lg font-bold">
        <i class="fa-solid fa-house-chimney text-lg"></i>
      </div>
      <div>
        <h1 class="font-bold text-base md:text-lg leading-tight">Construction Map Tracker</h1>
        <p class="text-xs text-slate-400 hidden md:block">ระบบพิกัดหน้างานและไซต์ก่อสร้างออนไลน์</p>
      </div>
    </div>

    <button onclick="toggleAdminModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-2 transition shadow">
      <i class="fa-solid fa-plus-circle"></i>
      <span>เพิ่มพิกัดหน้างาน (Admin)</span>
    </button>
  </header>

  <div class="flex-1 flex flex-col md:flex-row relative overflow-hidden">
    <div class="w-full md:w-[400px] bg-white border-r border-slate-200 flex flex-col z-[50] h-1/2 md:h-full shadow-lg shrink-0">
      <div class="p-4 border-b border-slate-100 bg-slate-50 space-y-3 shrink-0">
        <input type="text" id="searchInput" oninput="filterData()" placeholder="ค้นหาชื่อบ้าน, ที่อยู่..." 
               class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
        <div class="flex gap-2">
          <button onclick="filterStatus('ALL')" class="bg-slate-800 text-white text-xs px-3 py-1.5 rounded-full">ทั้งหมด</button>
          <button onclick="filterStatus('สร้างเสร็จแล้ว')" class="bg-white border text-slate-600 text-xs px-3 py-1.5 rounded-full">เสร็จแล้ว</button>
          <button onclick="filterStatus('กำลังก่อสร้าง')" class="bg-white border text-slate-600 text-xs px-3 py-1.5 rounded-full">กำลังสร้าง</button>
        </div>
      </div>
      <div id="projectList" class="flex-1 overflow-y-auto p-3 space-y-3"></div>
      <div class="p-2 border-t text-center text-xs text-slate-400 shrink-0 bg-white">
        พบข้อมูลทั้งหมด <span id="projectCount" class="font-bold text-slate-700">0</span> รายการ
      </div>
    </div>

    <div class="flex-1 relative z-0 h-1/2 md:h-full bg-slate-200">
      <div id="map" class="w-full h-full"></div>
      <button onclick="locateUser()" title="ตำแหน่งของฉัน" class="absolute bottom-6 right-6 z-[30] bg-white p-3 rounded-full shadow-lg border text-lg flex items-center justify-center w-12 h-12">
        <i class="fa-solid fa-crosshairs text-blue-600"></i>
      </button>
    </div>
  </div>

  <div id="adminModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[9999] flex justify-center items-center hidden p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
      <div class="bg-slate-900 text-white px-5 py-4 flex justify-between items-center shrink-0">
        <h3 class="font-bold text-base">บันทึกข้อมูลพิกัดก่อสร้างใหม่</h3>
        <button type="button" onclick="toggleAdminModal()" class="text-slate-400 hover:text-white text-lg">×</button>
      </div>

      <form id="addProjectForm" onsubmit="handleFormSubmit(event)" class="p-5 overflow-y-auto space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">ชื่อโครงการ / บ้านลูกค้า *</label>
          <input type="text" id="projectName" required class="w-full border rounded p-2 text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">สถานะโครงการ</label>
          <select id="projectStatus" class="w-full border rounded p-2 text-sm">
            <option value="กำลังก่อสร้าง">กำลังก่อสร้าง</option>
            <option value="สร้างเสร็จแล้ว">สร้างเสร็จแล้ว</option>
          </select>
        </div>

        <div class="bg-slate-50 p-3 rounded border">
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">รูปภาพหน้างาน / บ้าน</label>
          <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)" class="text-xs">
          <div id="previewContainer" class="mt-3 hidden relative rounded overflow-hidden border">
            <img id="imagePreview" src="" class="w-full h-32 object-cover">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">ที่อยู่อย่างย่อ</label>
          <input type="text" id="projectAddress" class="w-full border rounded p-2 text-sm">
        </div>

        <div class="bg-slate-50 p-3 rounded border space-y-2">
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold text-slate-700 uppercase">พิกัดสถานที่ (Lat, Lng) *</span>
            <button type="button" onclick="getCurrentGPS()" class="text-xs text-blue-600 font-semibold">ดึงพิกัด (GPS)</button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input type="number" step="any" id="projectLat" required placeholder="Lat" class="border rounded p-2 text-sm">
            <input type="number" step="any" id="projectLng" required placeholder="Lng" class="border rounded p-2 text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">รายละเอียดงาน</label>
          <textarea id="projectDetails" rows="2" class="w-full border rounded p-2 text-sm"></textarea>
        </div>

        <div class="pt-2 flex justify-end gap-2 border-t">
          <button type="button" onclick="toggleAdminModal()" class="px-4 py-2 rounded text-sm text-slate-600">ยกเลิก</button>
          <button type="submit" class="px-4 py-2 rounded text-sm bg-amber-500 text-slate-950 font-bold">บันทึกข้อมูล</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let projects = JSON.parse(localStorage.getItem('my_projects')) || [
      {
        id: "P001",
        name: "บ้านคุณสมชาย (สไตล์นอร์ดิก)",
        status: "สร้างเสร็จแล้ว",
        address: "อ.เมือง จ.นครราชสีมา",
        lat: 14.9733,
        lng: 102.0831,
        image: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=500&q=80",
        details: "บ้านเดี่ยว 2 ชั้น 3 ห้องนอน 2 ห้องน้ำ"
      }
    ];

    let map, markersGroup, base64Image = "";

    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(initMap, 300);
    });

    function initMap() {
      map = L.map('map').setView([14.9733, 102.0831], 9);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);
      markersGroup = L.layerGroup().addTo(map);
      renderUI(projects);
      map.invalidateSize();
    }

    function renderUI(data) {
      const listContainer = document.getElementById('projectList');
      listContainer.innerHTML = '';
      if (markersGroup) markersGroup.clearLayers();

      document.getElementById('projectCount').innerText = data.length;

      data.forEach(p => {
        const isDone = p.status === 'สร้างเสร็จแล้ว';
        const badgeColor = isDone ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700';
        const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;

        if (map && markersGroup) {
          const marker = L.marker([p.lat, p.lng]).bindPopup(`
            <div class="text-xs p-1">
              <img src="${p.image}" class="w-full h-24 object-cover rounded mb-2">
              <strong class="text-sm">${p.name}</strong>
              <p class="text-slate-500">${p.address}</p>
              <a href="${gmapsUrl}" target="_blank" class="inline-block mt-2 bg-blue-600 text-white px-2 py-1 rounded">นำทาง</a>
            </div>
          `);
          markersGroup.addLayer(marker);
          p.markerRef = marker;
        }

        const card = document.createElement('div');
        card.className = "bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-2";
        card.innerHTML = `
          <div class="flex gap-3 cursor-pointer">
            <img src="${p.image}" class="w-20 h-20 rounded-lg object-cover bg-slate-100 shrink-0">
            <div class="flex-1 overflow-hidden">
              <span class="text-[10px] px-2 py-0.5 rounded font-semibold ${badgeColor}">${p.status}</span>
              <h4 class="font-bold text-slate-800 text-sm truncate mt-1">${p.name}</h4>
              <p class="text-xs text-slate-500 truncate">${p.address}</p>
            </div>
          </div>
          <div class="pt-2 border-t flex items-center gap-2">
            <a href="${gmapsUrl}" target="_blank" class="flex-1 bg-blue-50 text-blue-700 border border-blue-200 py-1.5 px-3 rounded text-xs font-bold text-center">นำทาง</a>
            <button onclick="deleteProject('${p.id}', event)" class="bg-red-50 text-red-600 border border-red-200 py-1.5 px-3 rounded text-xs font-bold">ลบ</button>
          </div>
        `;

        card.querySelector('.flex').onclick = () => {
          if (map && p.markerRef) {
            map.flyTo([p.lat, p.lng], 15);
            p.markerRef.openPopup();
          }
        };
        listContainer.appendChild(card);
      });
    }

    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          base64Image = e.target.result;
          document.getElementById('imagePreview').src = base64Image;
          document.getElementById('previewContainer').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function deleteProject(id, event) {
      event.stopPropagation();
      if (confirm('ต้องการลบรายการนี้ใช่หรือไม่?')) {
        projects = projects.filter(p => p.id !== id);
        localStorage.setItem('my_projects', JSON.stringify(projects));
        renderUI(projects);
      }
    }

    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      renderUI(projects.filter(p => p.name.toLowerCase().includes(query) || p.address.toLowerCase().includes(query)));
    }

    function filterStatus(status) {
      renderUI(status === 'ALL' ? projects : projects.filter(p => p.status === status));
    }

    function toggleAdminModal() {
      document.getElementById('adminModal').classList.toggle('hidden');
    }

    function getCurrentGPS() {
      navigator.geolocation.getCurrentPosition(pos => {
        document.getElementById('projectLat').value = pos.coords.latitude.toFixed(6);
        document.getElementById('projectLng').value = pos.coords.longitude.toFixed(6);
      });
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const newProject = {
        id: "P" + Date.now(),
        name: document.getElementById('projectName').value,
        status: document.getElementById('projectStatus').value,
        address: document.getElementById('projectAddress').value || "ไม่ระบุที่อยู่",
        lat: parseFloat(document.getElementById('projectLat').value),
        lng: parseFloat(document.getElementById('projectLng').value),
        image: base64Image || "https://images.unsplash.com/photo-1503387762-592deb58ef4e?w=500&q=80",
        details: document.getElementById('projectDetails').value || "-"
      };
      projects.unshift(newProject);
      localStorage.setItem('my_projects', JSON.stringify(projects));
      renderUI(projects);
      toggleAdminModal();
      document.getElementById('addProjectForm').reset();
      base64Image = "";
      document.getElementById('previewContainer').classList.add('hidden');
      if (map) map.flyTo([newProject.lat, newProject.lng], 15);
    }
  </script>
</body>
</html>
